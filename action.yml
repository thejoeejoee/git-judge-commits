name: git-judge-commits
description: Judge every commit in a range and check whether its message tells the truth about its diff.
author: Josef Kolář

branding:
  icon: git-commit
  color: purple

inputs:
  api-key:
    description: A TypeSafe API key. Store it as a secret and pass it here.
    required: true
  revisions:
    description: >-
      A revision range or a pull request URL. Left empty on a pull_request event
      this becomes the request's own URL, which sidesteps the shallow checkout
      actions/checkout does by default; elsewhere it judges the branch against
      the default branch.
    required: false
    default: ""
  fail-on:
    description: >-
      Conditions that fail the step, e.g. `message=nok,concern=mixed` or
      `attention>=4`. Empty means report only, never fail.
    required: false
    default: ""
  min-confidence:
    description: Margin below which an answer is reported as unknown rather than asserted.
    required: false
    default: "0.2"
  threshold:
    description: Probability bar for a yes on the yes/no questions.
    required: false
    default: "0.5"
  model:
    description: Which Jev to ask. Pin a version once thresholds are tuned.
    required: false
    default: typesafe:jev-latest
  limit:
    description: Most commits to judge.
    required: false
    default: "32"
  diff-budget:
    description: Diff characters sent per commit, spread across its files.
    required: false
    default: "16000"
  exclude:
    description: Newline- or comma-separated pathspecs to drop from diffs, e.g. `*.lock`.
    required: false
    default: ""
  version:
    description: >-
      Which release of git-judge-commits to run. Defaults to the one this action
      was released with, so pinning the action pins the code it runs. Set it
      empty to take the newest release instead.
    required: false
    default: "0.3.1" # x-release-please-version
  source:
    description: >-
      Install from here instead of PyPI: a checkout path, or a git URL such as
      `git+https://github.com/thejoeejoee/git-judge-commits@main`. Mostly for
      trying an unreleased change.
    required: false
    default: ""
  cache:
    description: >-
      Carry the verdict cache between runs, so a push only pays for the commits
      it added. Restores from an earlier run on this branch, or from the base
      branch's.
    required: false
    default: "true"
  summary:
    description: Write the verdicts to the job summary.
    required: false
    default: "true"
  comment:
    description: >-
      Post the verdicts as a pull request comment, editing the previous one
      rather than adding another. Needs `pull-requests: write`.
    required: false
    default: "true"
  comment-key:
    description: >-
      Distinguishes this comment from other runs of the action on the same pull
      request. Only needed when the action is used more than once.
    required: false
    default: default
  working-directory:
    description: Directory to run in.
    required: false
    default: "."

outputs:
  json:
    description: Path to the verdicts as JSON.
    value: ${{ steps.judge.outputs.json }}
  judged:
    description: How many commits were judged.
    value: ${{ steps.report.outputs.judged }}
  breaking:
    description: How many put an interface or stored data at stake.
    value: ${{ steps.report.outputs.breaking }}
  mismatched:
    description: How many have a message that does not describe the diff.
    value: ${{ steps.report.outputs.mismatched }}
  mixed:
    description: How many do more than one thing.
    value: ${{ steps.report.outputs.mixed }}
  failed:
    description: Whether a fail-on condition matched.
    value: ${{ steps.report.outputs.failed }}
  comment:
    description: Path to the markdown that was posted.
    value: ${{ steps.report.outputs.comment }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true

    # Every commit in the range is re-judged on every push otherwise, including
    # the ones that have not moved. The exact key hits when a run is repeated on
    # the same commit and nothing is written back; a new push falls through to
    # the prefix, reuses what it can, and saves the rest.
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.git-judge-commits-cache
        key: git-judge-commits-v1-${{ github.sha }}
        restore-keys: |
          git-judge-commits-v1-

    - id: judge
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        HAVE_KEY: ${{ inputs.api-key != '' }}
        GIT_JUDGE_COMMITS_CACHE: ${{ github.workspace }}/.git-judge-commits-cache
        # `gh pr view` supplies the base commit for a pull request URL, and the
        # fetch of a private repository's refs needs it too.
        GH_TOKEN: ${{ github.token }}
        INPUT_REVISIONS: ${{ inputs.revisions }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SOURCE: ${{ inputs.source }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        set -uo pipefail

        # A fork's pull request cannot read the repository's secrets, so the key
        # arrives empty. Saying so and stopping beats a red build that only ever
        # means "this was a fork".
        if [ "$HAVE_KEY" != "true" ]; then
          echo "::warning::no api-key, skipping. A fork's pull request cannot read repository secrets."
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -n "$INPUT_SOURCE" ]; then
          package="$INPUT_SOURCE"
        elif [ -n "$INPUT_VERSION" ]; then
          package="git-judge-commits==${INPUT_VERSION#v}"
        else
          package="git-judge-commits"
        fi

        args=()
        revisions="$INPUT_REVISIONS"
        if [ -z "$revisions" ] && [ -n "${PR_URL:-}" ]; then
          # The pull request's own URL: the tool fetches the refs it needs, so a
          # depth-1 checkout is not a problem.
          revisions="$PR_URL"
        fi
        [ -n "$revisions" ] && args+=("$revisions")

        args+=(--limit "${{ inputs.limit }}")
        args+=(--model "${{ inputs.model }}")
        args+=(--threshold "${{ inputs.threshold }}")
        args+=(--min-confidence "${{ inputs.min-confidence }}")
        args+=(--diff-budget "${{ inputs.diff-budget }}")

        while IFS= read -r pathspec; do
          [ -n "$pathspec" ] && args+=(--exclude "$pathspec")
        done <<< "$(printf '%s' "$INPUT_EXCLUDE" | tr ',' '\n')"

        while IFS= read -r condition; do
          [ -n "$condition" ] && args+=(--fail-on "$condition")
        done <<< "$(printf '%s' "$INPUT_FAIL_ON" | tr '\n' ',' | tr ',' '\n')"

        json="$RUNNER_TEMP/git-judge-commits.json"
        echo "json=$json" >> "$GITHUB_OUTPUT"

        echo "::group::git-judge-commits ${args[*]}"
        # --refresh-package, because the uv cache carries the package index with
        # it: a runner that last saw this package before the pinned release
        # exists will insist that version cannot be found.
        uvx --refresh-package git-judge-commits --from "$package" \
          git-judge-commits "${args[@]}" --verbose --json > "$json"
        status=$?
        echo "::endgroup::"

        echo "status=$status" >> "$GITHUB_OUTPUT"
        # Never fail here: the summary is written first, and the real exit comes
        # after it, so a red build still shows its verdicts.
        exit 0

    - id: report
      if: ${{ steps.judge.outputs.skipped != 'true' }}
      shell: bash
      env:
        JSON: ${{ steps.judge.outputs.json }}
        STATUS: ${{ steps.judge.outputs.status }}
        SUMMARY: ${{ inputs.summary }}
        MARKER: <!-- git-judge-commits:${{ inputs.comment-key }} -->
        # Present only on a pull request, and it changes where each commit links to.
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "${{ github.action_path }}/scripts/report.py"

    - name: comment on the pull request
      if: ${{ steps.judge.outputs.skipped != 'true' && inputs.comment == 'true' && github.event.pull_request.number && steps.report.outputs.comment }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BODY: ${{ steps.report.outputs.comment }}
        MARKER: <!-- git-judge-commits:${{ inputs.comment-key }} -->
      run: |
        set -uo pipefail
        # Edit the comment from the last run rather than adding another, so a
        # busy branch does not bury its own review under a stack of them.
        existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | first // empty")

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$BODY" --silent
        else
          gh api -X POST "repos/$GH_REPO/issues/$PR/comments" -F "body=@$BODY" --silent
        fi || {
          # A fork's token is read-only. That is not a reason to fail the build.
          echo "::warning::could not post the comment; pull-requests: write is needed (and is never granted to forks)"
          exit 0
        }
